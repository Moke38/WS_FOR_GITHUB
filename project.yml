name: StockMover
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StockMover:
    type: application
    platform: iOS
    sources:
      - path: StockMover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StockMover
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 値動きウォッチ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
  StockMoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockMoverTests
    dependencies:
      - target: StockMover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StockMover:
    build:
      targets:
        StockMover: all
        StockMoverTests: [test]
    test:
      targets:
        - StockMoverTests
